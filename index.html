<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Simulatore ATM Bancomat</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .atm-container { 
            background-color: #2c3e50; 
            color: white; 
            padding: 25px; 
            border-radius: 15px; 
            width: 420px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .screen { 
            background-color: #3498db; 
            padding: 20px; 
            border-radius: 8px; 
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }
        input[type="password"], input[type="number"], select { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        .radio-group {
            background-color: #2980b9;
            padding: 10px;
            border-radius: 5px;
            margin-top: 8px;
        }
        .radio-option {
            margin: 8px 0;
            display: flex;
            align-items: center;
            font-size: 15px;
        }
        .radio-option input {
            margin-right: 10px;
            cursor: pointer;
        }
        button { 
            width: 100%;
            background-color: #2ecc71; 
            color: white; 
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
        }
        button:hover { 
            background-color: #27ae60; 
        }
        pre { 
            background: #ecf0f1; 
            color: #333; 
            padding: 10px; 
            border-radius: 5px; 
            overflow-x: auto; 
            margin-top: 15px;
            max-height: 180px;
        }
        .hidden {
            display: none;
        }
        .error-text {
            color: #ff3860;
            font-weight: bold;
            margin-top: 5px;
            display: none;
        }

        /* Nuovi stili CSS per il Banner dell'Esito Transazione */
        .notification-banner {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .status-loading {
            background-color: #f39c12;
            color: white;
        }
        .status-success {
            background-color: #27ae60;
            color: white;
        }
        .status-failed {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

    <div class="atm-container">
        <div class="screen">
            <h2>Sportello ATM Bancomat</h2>
            
            <!-- Campo PIN aggiornato: maxlength a 4 e blocco lettere -->
            <label for="pinInput">PIN Sicurezza (esattamente 4 cifre):</label>
            <input type="password" id="pinInput" placeholder="Inserisci PIN (4 cifre)" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <div id="pinError" class="error-text">Inserire un PIN valido di 4 cifre!</div>

            <!-- Selezione Operazione -->
            <label for="operationSelect">Tipo Operazione:</label>
            <select id="operationSelect" onchange="gestisciOperazione()">
                <option value="PRELIEVO">Prelievo</option>
                <option value="DEPOSITO">Deposito</option>
                <option value="SALDO">Visualizza Saldo</option>
            </select>

            <!-- Sezione Importo -->
            <div id="sectionAmount">
                <label>Seleziona l'Importo (€):</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="r50" name="importoRadio" value="50" checked onclick="gestisciSelezioneImporto()">
                        <label for="r50">50 €</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="r100" name="importoRadio" value="100" onclick="gestisciSelezioneImporto()">
                        <label for="r100">100 €</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="r200" name="importoRadio" value="200" onclick="gestisciSelezioneImporto()">
                        <label for="r200">200 €</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="rCustom" name="importoRadio" value="custom" onclick="gestisciSelezioneImporto()">
                        <label for="rCustom">Altro importo (libero)</label>
                    </div>
                </div>

                <label for="customAmount" style="margin-top: 10px;">Importo personalizzato:</label>
                <input type="number" id="customAmount" placeholder="Es. 70" disabled min="10">
                <div id="amountError" class="error-text">Inserire un importo valido!</div>
            </div>

            <!-- Bottone di invio aggiornato per bloccare il refresh -->
            <button type="button" onclick="eseguiOperazione(event)">Conferma Operazione</button>

            <!-- Banner dinamico per mostrare l'esito restituito da TIBCO -->
            <div id="notificationBanner" class="notification-banner hidden"></div>
        </div>

        <!-- Area di visualizzazione dell'XML generato -->
        <div id="xmlContainer" class="hidden">
            <h3>XML Generato e Scaricato:</h3>
            <pre id="xmlOutput"></pre>
        </div>
    </div>

<script>
    let pollingInterval = null;

    function gestisciOperazione() {
        const op = document.getElementById('operationSelect').value;
        const amountSection = document.getElementById('sectionAmount');
        
        if (op === 'SALDO') {
            amountSection.classList.add('hidden');
        } else {
            amountSection.classList.remove('hidden');
        }
    }

    function gestisciSelezioneImporto() {
        const isCustom = document.getElementById('rCustom').checked;
        const customInput = document.getElementById('customAmount');
        
        if (isCustom) {
            customInput.disabled = false;
            customInput.focus();
        } else {
            customInput.disabled = true;
            customInput.value = '';
        }
    }

    // Aggiunto l'evento come parametro per gestire il blocco della pagina
    function eseguiOperazione(event) {
        if (event) event.preventDefault(); // Blocca il ricaricamento

        const pin = document.getElementById('pinInput').value.trim();
        const operation = document.getElementById('operationSelect').value;
        const pinError = document.getElementById('pinError');
        const amountError = document.getElementById('amountError');

        pinError.style.display = 'none';
        amountError.style.display = 'none';

        // Validazione rigorosa: il PIN deve essere di 4 cifre esatte
        if (pin.length !== 4) {
            pinError.textContent = "Il PIN deve contenere esattamente 4 numeri!";
            pinError.style.display = 'block';
            return;
        }

        let amount = 0;
        if (operation !== 'SALDO') {
            const radioSelected = document.querySelector('input[name="importoRadio"]:checked').value;
            if (radioSelected === 'custom') {
                amount = parseFloat(document.getElementById('customAmount').value);
                if (isNaN(amount) || amount <= 0) {
                    amountError.style.display = 'block';
                    return;
                }
            } else {
                amount = parseFloat(radioSelected);
            }
        }

        const timestamp = new Date().toISOString();
        const xmlString = `<?xml version="1.0" encoding="UTF-8"?>
<Transaction>
    <Pin>${pin}</Pin>
    <OperationType>${operation}</OperationType>
    <Amount>${amount.toFixed(2)}</Amount>
    <Timestamp>${timestamp}</Timestamp>
</Transaction>`;

        document.getElementById('xmlOutput').textContent = xmlString;
        document.getElementById('xmlContainer').classList.remove('hidden');

        const nomeFile = `transazione_${operation.toLowerCase()}_${pin}.xml`;
        downloadXMLAutomatico(xmlString, nomeFile);

        avviaAttesaEsitoTIBCO();
    }

    function downloadXMLAutomatico(contenuto, nomeFile) {
        const blob = new Blob([contenuto], { type: 'application/xml' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = nomeFile;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    function avviaAttesaEsitoTIBCO() {
        const banner = document.getElementById('notificationBanner');
        banner.className = 'notification-banner status-loading';
        banner.innerHTML = '⏳ Elaborazione TIBCO in corso (Verifica PIN e Saldo)...';
        banner.classList.remove('hidden');

        if (pollingInterval) clearInterval(pollingInterval);
        
        setTimeout(() => {
            pollingInterval = setInterval(leggiEsitoXML, 1500);
        }, 1000);
    }

    async function leggiEsitoXML() {
        try {
            const response = await fetch('esito.xml?t=' + new Date().getTime());

            if (!response.ok) return;

            const textData = await response.text();
            if (!textData || textData.trim() === '') return;

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(textData, "text/xml");

            const status = xmlDoc.getElementsByTagName("Status")[0]?.textContent;
            const message = xmlDoc.getElementsByTagName("Message")[0]?.textContent;

            const banner = document.getElementById('notificationBanner');

            if (status === 'OK') {
                clearInterval(pollingInterval);
                banner.className = 'notification-banner status-success';
                banner.innerHTML = `✅ ${message}`;
            } else if (status) {
                // Raccoglie qualsiasi stato diverso da OK (KO, ERRORE, ecc.) per mostrare il messaggio di saldo insufficiente o pin errato
                clearInterval(pollingInterval);
                banner.className = 'notification-banner status-failed';
                banner.innerHTML = `❌ ${message}`;
            }
        } catch (err) {
            console.log("In attesa del nuovo file esito.xml...", err);
        }
    }
</script>
</body>
</html>
